services:
  - type: web
    name: study-helper-2027-bot
    env: python
    buildCommand: pip install -r study_bot/requirements.txt
    startCommand: python3 run_bot.py
    healthCheckPath: /
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TZ
        value: Asia/Shanghai
      - key: RENDER_DISK_PATH
        value: /opt/render/project/data
    disk:
      name: bot-data
      mountPath: /opt/render/project/data
      sizeGB: 1
