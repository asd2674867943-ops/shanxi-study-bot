services:
  - type: worker
    name: shanxi-study-bot
    env: python
    runtime: python3.11
    buildCommand: pip install -r study_bot/requirements.txt
    startCommand: python run_bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
